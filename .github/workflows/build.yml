name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Gradle project (unzip if needed)
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
          if [ -z "$f" ]; then
            z=$(find . -maxdepth 2 -iname '*.zip' | head -n 1)
            if [ -z "$z" ]; then
              echo "::error::No project files and no .zip found in the repository"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$z" -d "$RUNNER_TEMP/proj"
            f=$(find "$RUNNER_TEMP/proj" -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
            if [ -z "$f" ]; then
              echo "::error::settings.gradle.kts not found inside the zip"
              exit 1
            fi
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPets-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
